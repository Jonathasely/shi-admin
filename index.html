const updatePart=(id,updates)=>{setParts(prev=>prev.map(p=>p.id===id?{...p,...updates}:p));setSelPart(prev=>prev&&prev.id===id?{...prev,...updates}:prev)};

<div className="fade-in">
<div style={{display:"flex",alignItems:"center",gap:12,marginBottom:24}}>
<button onClick={()=>{setSub(null);setSelEvt(null)}} style={{...S.btnS,padding:"6px 14px",fontSize:10}}>← Voltar</button>

<td style={S.td}>{p.combination?<span style={S.pill(C.accent,C.accentL)}>Registrada</span>:<span style={S.pill(C.g2,"#f0f0f0")}>Pendente</span>}</td>

</div>

</div>
<div style={{marginBottom:16}}>
<div style={S.label}>Prontos para envio ({ready.length})</div>
{ready.length?ready.map(p=>(
<div key={p.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderBottom:`1px solid ${C.border}`,fontSize:12}}>
<span>{p.name}</span>
<span style={{color:C.g3}}>{p.combination.base} + {p.combination.items.length} ingredientes</span>
</div>)):<div style={{padding:12,background:C.amberL,fontSize:12,color:C.amber}}>Nenhum participante com combinação registrada e pendente de envio.</div>}
</div>
{alreadySent.length>0&&<div style={{marginBottom:16}}>
<div style={S.label}>Já enviados ({alreadySent.length})</div>
{alreadySent.map(p=><div key={p.id} style={{fontSize:12,color:C.g3,padding:"4px 0"}}>{p.name} — {p.sentAt}</div>)}
</div>}
<div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:20}}>
<button style={S.btnS} onClick={()=>setModal(null)}>Cancelar</button>
<button style={S.btn} onClick={()=>{setModal(null);showToast(`${ready.length} mensagens enviadas com sucesso!`)}}>Enviar para {ready.length} participantes</button>
</div>
</div>
</div>);};

/* ═══════ RENDER ═══════ */
const content=()=>{
if(page==="dash")return<Dashboard/>;
if(page==="events"){
if(sub==="participant")return<ParticipantDetail/>;
if(sub==="detail")return<EventDetail/>;
if(sub==="essDetail")return<EssenceDetail/>;
return<EventsList/>;
}
if(page==="essences"){
if(sub==="essDetail")return<EssenceDetail/>;
return<EssencesList/>;
}
if(page==="ingredients")return<IngredientsList/>;
if(page==="participants")return<ParticipantsList/>;
if(page==="reports")return<Reports/>;
if(page==="settings")return<Settings/>;
return<Dashboard/>;
};

return(
<div style={{display:"flex",height:"100vh",overflow:"hidden"}}>
<Sidebar/>
<div style={{flex:1,overflow:"auto",padding:32}}>
{content()}
</div>
<DispatchModal/>
{toast&&<div style={{position:"fixed",bottom:24,right:24,background:C.bk,color:C.white,padding:"12px 20px",fontSize:12,fontWeight:500,letterSpacing:.5,zIndex:2000,animation:"fadeIn .2s ease",boxShadow:"0 8px 30px rgba(0,0,0,.15)"}}>{toast}</div>}
</div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
